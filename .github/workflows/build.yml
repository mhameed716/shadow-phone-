name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug > "$RUNNER_TEMP/gradle-build.log" 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            echo '### Gradle build failure (last 60 lines)' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 "$RUNNER_TEMP/gradle-build.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::error title=Gradle build::$line"
            done < <(tail -n 30 "$RUNNER_TEMP/gradle-build.log")
          fi
          exit "$result"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-phone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
